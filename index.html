<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Persona Favorita</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f5f5f5;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      position: relative;
      max-width: 900px;
      width: 100%;
      z-index: 5;
    }

    .card {
      position: relative;
      background: rgba(20, 20, 40, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 50px 40px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 20, 147, 0.2);
      border: 1px solid rgba(255, 20, 147, 0.3);
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(255, 20, 147, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .floating-text {
      position: absolute;
      font-size: 120px;
      font-weight: bold;
      opacity: 0.05;
      white-space: nowrap;
      pointer-events: none;
      animation: float 20s infinite ease-in-out;
    }

    .floating-text:nth-child(1) {
      top: -30px;
      left: -50px;
      animation-delay: 0s;
    }

    .floating-text:nth-child(2) {
      bottom: -40px;
      right: -60px;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(20px);
      }
    }

    .content {
      position: relative;
      z-index: 2;
    }

    .music-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      border: none;
      box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
    }

    .music-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 20, 147, 0.6);
    }

    .music-button:active {
      transform: translateY(0px);
    }

    .music-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.2);
      }
    }

    .music-button:hover .music-dot,
    .music-button.playing .music-dot {
      animation: pulse 1s infinite;
    }

    h1 {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff1493, #ff69b4, #ffb6c1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 14px;
      color: #ff69b4;
      margin-bottom: 30px;
      font-style: italic;
      font-weight: 500;
    }

    .message-box {
      background: rgba(255, 20, 147, 0.08);
      border-left: 4px solid #ff1493;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      line-height: 1.8;
      font-size: 16px;
    }

    .message-box p {
      margin: 12px 0;
      color: #e8e8f0;
    }

    .message-box p:first-child {
      margin-top: 0;
    }

    .message-box p:last-child {
      margin-bottom: 0;
    }

    .signature {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 20, 147, 0.3);
    }

    .signature-text {
      font-size: 14px;
      color: #ff69b4;
      font-style: italic;
    }

    .signature-author {
      font-size: 18px;
      font-weight: 600;
      color: #ff1493;
      margin-top: 8px;
    }

    /* SoundCloud player oculto */
    #sc-container {
      display: none;
    }

    /* Animación de entrada */
    .card {
      animation: slideIn 0.8s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card {
        padding: 30px 25px;
        border-radius: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .message-box {
        font-size: 15px;
        padding: 20px;
      }

      .floating-text {
        font-size: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="floating-text">♥</div>
    <div class="floating-text">♥</div>

    <div class="card">
      <div class="content">
        <!-- Botón de música -->
        <button class="music-button" id="playToggle">
          <span class="music-dot"></span>
          <span id="playLabel">♫ Mi Persona Favorita – Río Roma</span>
        </button>

        <!-- Título -->
        <h1>Mi princesa,</h1>
        <p class="subtitle">Un mensaje especial para ti</p>

        <!-- Mensaje principal -->
        <div class="message-box">
          <p>En cada rincón de mi corazón solo hay espacio para una sola persona y esa persona eres tu ❤️</p>
          <p>La distancia no puede apagar lo que siento al contrario mi amor por ti crece cada día más.</p>
          <p>Te quiero muchooooo</p>
        </div>

        <!-- Firma -->
        <div class="signature">
          <span class="signature-text">Tu peque</span>
          <span class="signature-author">Con mucho cariño 🥰</span>
        </div>
      </div>

      <!-- Player SoundCloud oculto -->
      <div id="sc-container">
        <iframe
          id="sc-widget"
          width="100%"
          height="166"
          scrolling="no"
          frameborder="no"
          allow="autoplay"
          src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/ana-martinez-rdz/rio-roma-mi-persona-favorita%3Fsi%3D20036d8fef8f43418b536a5aa2b65a13&color=%23ff1493&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false">
        </iframe>
      </div>
    </div>
  </div>

  <!-- SDK de SoundCloud -->
  <script src="https://w.soundcloud.com/player/api.js"></script>

  <script>
    const toggle = document.getElementById("playToggle");
    const label = document.getElementById("playLabel");
    const iframe = document.getElementById("sc-widget");
    const widget = SC.Widget(iframe);
    let isPlaying = false;

    toggle.addEventListener("click", () => {
      if (!isPlaying) {
        widget.play();
        isPlaying = true;
        label.textContent = "⏸ Pausar canción";
        toggle.classList.add("playing");
      } else {
        widget.pause();
        isPlaying = false;
        label.textContent = "♫ Mi Persona Favorita – Río Roma";
        toggle.classList.remove("playing");
      }
    });

    // Detectar cuando la canción termina
    widget.bind(SC.Widget.Events.FINISH, () => {
      isPlaying = false;
      label.textContent = "♫ Mi Persona Favorita – Río Roma";
      toggle.classList.remove("playing");
    });
  </script>
</body>
</html>
